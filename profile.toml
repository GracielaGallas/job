# Search profile built from the CV (CV-GracielaGallas-EN.pdf).
# Edit freely: every run of search.py reads this file.

[search]
days = 14                 # only jobs published in the last N days
city = "Berlin"
radius_km = 30
include_remote_germany = true

# Search terms sent to the portals (one request per term and portal).
queries = [
  "QA Engineer",
  "Senior QA Engineer",
  "Test Automation Engineer",
  "QA Lead",
  "SDET",
  "Quality Assurance Engineer",
  "Testautomatisierung",
  "Softwaretester",
]

[filter]
# Titles that clearly mean software QA: always kept.
title_strong = [
  '\bqa\b', 'quality engineer', 'test ?automation', 'testautomatisierung',
  'automation engineer', '\bsdet\b', 'software ?test', 'test ?engineer',
  'test ?analyst', 'test ?lead', 'software development engineer in test',
]
# Generic QA/test titles (also used for factory/lab QA in Germany): kept only when
# the title or description also mentions one of the `software_signal` words.
title_weak = [
  'quality assurance', 'qualit[äa]tssicherung', 'test ?manager', '\btester\b', 'testing',
]
software_signal = [
  'software', '\bweb', '\bapps?\b', '\bapi', 'automation', 'automatisierung',
  '\bsap\b', 'digital', 'platform', 'saas', 'agile', 'scrum',
]
# Titles containing any of these are dropped.
title_none = [
  'werkstudent', 'working student', 'praktik', 'intern\b', 'internship',
  'junior', 'ausbildung', 'azubi', 'trainee', 'duales studium', 'abschlussarbeit',
  'thesis', 'hardware', 'mechani', 'fahrzeug', 'lebensmittel', 'pharma', '\bgmp\b',
  '\blabor', 'elektro', 'electrical', 'medizinprodukt', 'chemi', 'penetration',
  'pentest', 'client service', 'customer service', 'absolvent', 'graduate',
]

[score]
# Extra points when the title signals the level you are aiming for.
seniority = ['senior', '\blead\b', 'team ?lead', 'head of', 'principal', 'staff', 'sr\.?\b', 'leitung', 'manager']
# Skills from the CV: each one found in title/description adds points.
skills = [
  'playwright', 'typescript', 'java\b', 'selenium', 'rest ?assured', 'cypress',
  '\bapi', 'ci/cd', 'javascript', 'junit', 'istqb', 'testrail', 'mobile',
  'accessibility', 'shift.?left', 'postman',
]

[exclude]
# Jobs whose description matches any of these are left out (and listed at the end of the
# results with the reason). Matching is case-insensitive.

# German above B1 required (B2, C1, C2, fluent...): your German is B1.
german_required = [
  'flie(ß|ss)end(e|en|es)?\s+deutsch', 'deutsch\w*\s+(\w+\s+)?flie(ß|ss)end',
  'verhandlungssicher', 'muttersprach', 'native german', 'german native',
  'deutsch[^.;\n]{0,100}\b(b2|c1|c2)\b', '\b(b2|c1|c2)\b[^.;\n]{0,40}deutsch',
  '(sehr )?gute[n]? deutschkenntnisse', 'deutschkenntnisse[^.;\n]{0,30}(sehr gut|gut|sicher|flie)',
  'beherrschst deutsch', '(kommunizierst|sprichst|schreibst)[^.;\n]{0,80}sicher[^.;\n]{0,10}deutsch', 'sicher(e|en)?\s+(auf |in )?deutsch',
  'deutsch und englisch[^.;\n]{0,40}(sehr gut|gut|flie|verhandlungs|sicher)',
  'fluent (in )?german', 'fluency in german', 'german[^.;\n]{0,40}\b(b2|c1|c2|native|fluent|fluency|proficien)', '\b(b2|c1|c2)\b[^.;\n]{0,20}german',
  '(good|very good|excellent|strong|professional|business|solid)\s+(command of |knowledge of |level of )?german\b(?!\s+(class|course|lesson))',
  'german (and|&) english (skills|communication|language)',
]

# Driving licence required (you don't have one).
driving_license = [
  'f(ü|ue)hrerschein', 'fahrerlaubnis', "driv(ing|er'?s) licen[cs]e", '\bklasse b\b',
]

# Outside your city only fully remote jobs fit. A job outside the city is left out when
# its description mentions hybrid/on-site work without also saying it is fully remote,
# or when it does not mention remote work at all.
onsite = [
  'hybrid', 'vor ort', 'on-?site', 'in[- ]office', 'im b(ü|ue)ro', 'präsenz',
  'days? (per|a) week (in|at) (the|our) office', 'tage (pro|die|in der) woche (im|vor)',
]
full_remote = [
  'fully remote', 'full[- ]remote', '100 ?% remote', 'remote[- ]first', 'remote only',
  'vollst(ä|ae)ndig remote', 'komplett remote', 'ortsunabh(ä|ae)ngig', 'work from anywhere',
  '100 ?% (home ?office|mobil)', 'deutschlandweit',
]
remote_words = ['remote', 'home ?office', 'mobiles arbeiten', 'mobil arbeiten']
